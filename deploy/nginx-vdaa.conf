# nginx site for vDAA. Installed once to /etc/nginx/conf.d/vdaa.conf by deploy-vdaa.sh; certbot --nginx then adds the 443 listener
# to this same server block (keep --no-redirect: port 80 must keep serving, an origin redirect makes Cloudflare loop).
#
# Real client IP: the VM already has /etc/nginx/conf.d/00-cloudflare-realip.conf (set_real_ip_from for every Cloudflare range +
# real_ip_header CF-Connecting-IP). Because of it $remote_addr below is the visitor's address when, and only when, the TCP peer
# really is Cloudflare; for anyone who reaches the origin directly it stays their own address. So this file does not repeat the
# ranges; it hands the app that one trustworthy value in CF-Connecting-IP, OVERWRITING whatever the client sent.
# server.js (clientIp) believes CF-Connecting-IP/X-Forwarded-For only when the socket peer is in TRUSTED_PROXIES, which is the
# local nginx (127.0.0.1,::1), so Node never needs the Cloudflare ranges and a forged header cannot reach the login throttle.

server {
  listen 80;
  listen [::]:80;
  server_name vdaa.michaelhtang.com core.michaelhtang.com;

  client_max_body_size 256k;                      # the app refuses bodies over 100 kB anyway

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;        # overwrite any client-supplied value: the app's same-origin check trusts it from this proxy
  proxy_set_header CF-Connecting-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;       # visitors only ever arrive over https (Cloudflare); the app sets Secure cookies on it
  proxy_read_timeout 60s;

  # Server-sent events: no buffering, and a read timeout well past the app's 25 s ping. (Cloudflare itself drops a silent
  # connection after 100 s, which the ping prevents.) No proxy_set_header here, so the server-level ones above still apply.
  location /api/stream {
    proxy_pass http://127.0.0.1:3020;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://127.0.0.1:3020;
  }
}
